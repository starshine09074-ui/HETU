name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hetu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: hetu-ci-throwaway
          MYSQL_DATABASE: ry-vue
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      MYSQL_PWD: hetu-ci-throwaway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: hetu-ui/package-lock.json
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install --yes default-mysql-client
      - name: Initialize disposable integration database
        run: |
          mysql --host=127.0.0.1 --user=root ry-vue < sql/ry_20260417.sql
          mysql --host=127.0.0.1 --user=root ry-vue < sql/hetu.sql
          mysql --host=127.0.0.1 --user=root ry-vue < sql/hetu_demo_users.sql
          # CAPTCHA is disabled only in this disposable CI database for test login.
          mysql --host=127.0.0.1 --user=root ry-vue \
            --execute="UPDATE sys_config SET config_value='false' WHERE config_key='sys.account.captchaEnabled'"
      - name: Build and test frontend
        run: |
          npm --prefix hetu-ui ci
          npm --prefix hetu-ui run build
      - name: Build and test backend
        run: mvn --batch-mode --no-transfer-progress test package
      - name: Start services and run smoke plus full integration tests
        env:
          HETU_DB_URL: jdbc:mysql://127.0.0.1:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
          HETU_DB_USERNAME: root
          HETU_DB_PASSWORD: hetu-ci-throwaway
          HETU_REDIS_HOST: 127.0.0.1
          HETU_REDIS_PASSWORD: ''
          HETU_CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
          HETU_SWAGGER_ENABLED: 'false'
        run: |
          export HETU_TOKEN_SECRET="$(openssl rand -hex 64)"
          java -jar ruoyi-admin/target/ruoyi-admin.jar > /tmp/hetu-ci-backend.log 2>&1 &
          echo $! > /tmp/hetu-ci-backend.pid
          npm --prefix hetu-ui run dev -- --host 127.0.0.1 > /tmp/hetu-ci-frontend.log 2>&1 &
          echo $! > /tmp/hetu-ci-frontend.pid
          ready=0
          for attempt in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:8080/captchaImage >/dev/null && curl --silent --fail http://127.0.0.1:5173/ >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/hetu-ci-backend.log
            cat /tmp/hetu-ci-frontend.log
            exit 1
          fi
          python3 scripts/smoke_test.py http://127.0.0.1:5173 http://127.0.0.1:8080
          python3 scripts/e2e_workflow.py http://127.0.0.1:8080
      - name: Show application logs on failure
        if: failure()
        run: |
          test ! -f /tmp/hetu-ci-backend.log || tail -200 /tmp/hetu-ci-backend.log
          test ! -f /tmp/hetu-ci-frontend.log || tail -100 /tmp/hetu-ci-frontend.log
